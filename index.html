<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SI-REVITAL LITE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="css/style.css">
<script src="js/tailwind-config.js"></script>
</head>
<body>
<div id="login" class="mx-auto max-w-[480px] min-h-screen flex flex-col px-5 pt-14 pb-8">
  <h1 class="text-[28px] font-extrabold leading-tight" style="color:var(--navy)">SI-REVITAL LITE</h1>
  <p class="mu mt-1" id="lgSub">Administrasi revitalisasi sekolah</p>
  <p class="mt-12 font-semibold">Masukkan PIN 4 digit</p>
  <div class="flex gap-3 my-4" id="dots" aria-hidden="true"></div>
  <p id="pinErr" class="bd text-sm min-h-[20px]" role="alert"></p>
  <div class="grid grid-cols-3 gap-3 mt-2" id="pad"></div>
  <p class="mu text-xs mt-auto pt-8">Program Revitalisasi Satuan Pendidikan SD, Swakelola P2SP</p>
</div>

<div id="main" class="mx-auto max-w-[480px] min-h-screen" hidden>
  <header class="sticky top-0 z-20 text-white px-4 py-3 flex items-center justify-between" style="background:var(--navy)">
    <div class="flex items-center gap-1 min-w-0"><button id="bk" onclick="back()" hidden aria-label="Kembali" class="shrink-0 -ml-2 w-11 h-11 flex items-center justify-center"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div><h1 id="ttl" class="text-[19px] font-bold leading-tight"></h1><p id="who" class="text-xs opacity-80"></p></div></div>
    <button onclick="logout()" class="text-sm font-semibold min-h-[44px] px-3 border border-white/40 rounded">Keluar</button>
  </header>
  <main id="view" class="px-4 pt-4 pb-28"></main>
  <nav id="nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] flex border-t bg-white" style="border-color:var(--line);padding-bottom:env(safe-area-inset-bottom)"></nav>
</div>

<div id="print" hidden></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-50 max-w-[440px] w-[calc(100%-32px)] px-4 py-3 rounded text-white text-sm font-semibold" hidden role="status"></div>


<div id="setup" class="mx-auto max-w-[480px] min-h-screen px-5 pt-10 pb-10" hidden></div>

<script src="js/core/config.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/nav.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/masuk.js"></script>
<script src="js/views/keluar.js"></script>
<script src="js/views/stok.js"></script>
<script src="js/views/progres.js"></script>
<script src="js/views/absen.js"></script>
<script src="js/views/kas.js"></script>
<script src="js/views/laporan.js"></script>
<script src="js/views/pengaturan.js"></script>
<script src="js/features/sync.js"></script>
<script src="js/features/edit.js"></script>
<script src="js/features/print.js"></script>
<script src="js/features/setup.js"></script>
<script src="js/features/gas-code.js"></script>
<script src="js/main.js"></script>
</body>
</html>
